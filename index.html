<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私のホームページ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container header-inner">
      <h1>ようこそ</h1>
      <nav>
        <a href="#about">紹介</a>
        <a href="#contact">お問い合わせ</a>
        <!-- ★ここのURLを、自分のインスタグラムのURLに変更してください -->
        <a class="sns-link" href="https://www.instagram.com//" target="_kazuma.codeblank" rel="noopener noreferrer" aria-label="Instagramを開く">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
          </svg>
        </a>
      </nav>
    </div>
  </header>

  <main>
    <div class="hero">
      <div class="container">
        <p class="hero-title">確かな技術と誠実な対応で、<br>お客様の課題を解決します</p>
        <a class="btn" href="#contact">お問い合わせはこちら</a>
      </div>
    </div>

    <section id="about">
      <div class="container">
        <h2>紹介</h2>
        <p>ここに紹介文を書きます。</p>
      </div>
    </section>

    <section id="contact" class="gray">
      <div class="container">
        <h2>お問い合わせ</h2>
        <p>ここに連絡先を書きます。</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-inner">
      <p>&copy; 2026 My Homepage</p>
      <!-- ★フッターのインスタグラムリンクも同じURLに変更してください -->
      <a class="sns-link" href="https://www.instagram.com/kazuma.code/" target="_blank" rel="noopener noreferrer" aria-label="Instagramを開く">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
